<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes Externas</title>
    <style>
        @font-face {
            font-family:'Panic';
            src: url(fontes/GhastlyPanic.ttf) format(truetype);
            font-weight: normal;
            font-style: normal;           
            /*
              Tipos de format()
              - opentype (otf)
              - truetype (ttf)
              - embedded-opentype
              - truetype-att (Apple Advanced Typography)
              - svg
            */
        }
        body{
            font-family: Arial, Helvetica, sans-serif
        }
        h1{
            font-family: 'Panic', Times, serif;          
        }
        p{
        font-family: 'Panic','Times, serif';
        font-size: 1em;
        }
    </style>
</head>
<body>
    <h1>Titulo</h1>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Amet ipsam repellat quam aliquid ullam nesciunt adipisci officiis et soluta magnam fuga veritatis maxime est vel quo nihil, eligendi doloribus? Unde!</p>
</body>
</html>
