<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mídias em HTML5</title>
</head>
<body>
    <h1>Imagens dinâmica</h1>
    <p>Tente abrir esse site em varios dispositivos diferentes ou simplesmente aumente ou diminua o tamanho do seu navegador.</p>
    
    <picture>
        <source media="(max-width: 750px)" srcset="imagens/imagem-pequena.png" type="image/png">
        <source media="(max-width: 1050px)" srcset="imagens/imagem-media.png" type="image/png">
        <img src="imagens/imagem-grande.png" alt="Imagem flexivel">
    </picture>
    <h1>Reproduzindo Áudio</h1>
    <p>Vamos aprender a reproduzir áudios em HTML5.</p>
    <!--MP3 WAV OGG-->
    <audio preload="metadata" controls loop>
      <source src="midia/Papoulas_256k.mp3" type="audio/mpeg">
      <source src="midia/Papoulas_256k.ogg" type="audio/ogg">
      <source src="midia/Papoulas_256k.wav" type="audio/wav">
      <p>infelizmente seu navegador não consegue reproduzir o áudio <a href="midia/Papoulas_256k.mp3">Clique aqui para baixar o arquivo MP3</a></p>
    </audio>
</body>
</html>
