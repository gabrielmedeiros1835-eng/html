<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>
        /* SELETORES PERSONALIZADOS
           #  = id
           .  = class
           :  = pseudo-class
           :: = pseudo-element
           >  = children
        */
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        a{
            color: red;
            text-decoration: none;
        }
        a:visited{
            color: darkred;
        }
        a:hover{
            color: black;
            text-decoration: underline;
        }
        a:active{
            color: yellow;
        }
    </style>
</head>
<body>
    <h1>Personalisando links</h1>
    <ul>
        <li><a href="https://drive.google.com/drive/u/3/folders/1xcQmsldTRW-3mKmkBAKTddi2LzH-_32I" target="_blank">Link para o drive</a></li>
        <li><a href="https://youtube.com/@pijamapreto">Canal do youtube</a></li>
        <li><a href="https://www.instagram.com/gabzin._.xp/">Link para o instagram</a></li>
    </ul>
</body>
</html>
